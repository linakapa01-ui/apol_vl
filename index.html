<!DOCTYPE html>
<html lang="el" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070807">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Νίκος Βλάχος</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" as="image" href="assets/logo-v3.png" fetchpriority="high">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=24">
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <header class="top">
        <div class="toolbar">
          <span class="sync-dot" id="sync-dot" hidden></span>
          <div class="toolbar-btns">
            <button class="icon-btn" id="bell" type="button" aria-label="Ειδοποιήσεις">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a5 5 0 0 0-5 5v2.3c0 .7-.3 1.4-.8 1.9L5 13.6V15h14v-1.4l-1.2-1.4a2.7 2.7 0 0 1-.8-1.9V8a5 5 0 0 0-5-5Z"/><path d="M10 17a2 2 0 0 0 4 0"/></svg>
              <span class="badge" id="badge" hidden>0</span>
            </button>
            <button class="icon-btn" id="theme" type="button" aria-label="Αλλαγή εμφάνισης">
              <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
          </div>
        </div>
        <div class="brand">
          <img src="assets/logo-v3.png" alt="Λογότυπο" class="logo" width="150" height="150" fetchpriority="high" decoding="async" data-brand-logo>
          <h1 id="brand-name">ΝΙΚΟΣ ΒΛΑΧΟΣ</h1>
          <p>Απεντόμωση · Μυοκτονία · Απολύμανση</p>
        </div>
      </header>
      <nav class="nav" id="nav" aria-label="Κύριο μενού"></nav>
      <footer class="credit"><button type="button" data-action="love">Made by Lina</button></footer>
    </div>
    <main id="view"></main>
  </div>
  <div class="sheet" id="sheet" hidden>
    <button class="sheet-backdrop" type="button" data-action="close" aria-label="Κλείσιμο"></button>
    <div class="sheet-card" id="sheet-body"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="util.js?v=7"></script>
  <script src="store.js?v=2"></script>
  <script src="domain.js?v=14"></script>
  <script src="views.js?v=14"></script>
  <script src="sheets.js?v=10"></script>
  <script src="dashboard.js?v=3"></script>
  <script src="messages.js?v=3"></script>
  <script src="contacts.js?v=1"></script>
  <script src="main.js?v=14"></script>
</body>
</html>
